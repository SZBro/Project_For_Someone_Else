<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fat Bear or Weak</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2a1a; overflow: hidden; font-family: 'Trebuchet MS', sans-serif; }
      #game { position: relative; width: 100%; height: 100%; }

      /* Start screen: a light card over the live river. */
      #menu {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(20, 14, 6, 0.15), rgba(20, 14, 6, 0.55));
        z-index: 10;
      }
      #menu[hidden] { display: none; }
      .card {
        width: min(420px, calc(100% - 32px)); padding: 28px 28px 22px; border-radius: 18px;
        background: rgba(250, 238, 214, 0.93); color: #3b2a1a; text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); border: 3px solid #b8752f;
      }
      .card h1 { margin: 0; font-size: 40px; color: #8a4a1c; letter-spacing: 0.5px; }
      .card .tag { margin: 4px 0 18px; font-size: 15px; color: #7a5a3a; }
      .card input[type='text'] {
        width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 18px; border-radius: 10px;
        border: 2px solid #c99a62; background: #fffaf0; color: #3b2a1a; outline: none; text-align: center;
      }
      .card input[type='text']:focus { border-color: #8a4a1c; }
      .card button {
        margin-top: 14px; width: 100%; padding: 12px; font-size: 22px; font-weight: bold; border: none; border-radius: 12px;
        background: #c4621d; color: #fff8ec; cursor: pointer; box-shadow: 0 4px 0 #8a4a1c;
      }
      .card button:hover { background: #d8732a; }
      .card button:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a4a1c; }
      .toggles { display: flex; justify-content: center; gap: 20px; margin-top: 14px; font-size: 15px; }
      .toggles label { cursor: pointer; user-select: none; }
      .controls { margin-top: 16px; font-size: 13px; line-height: 1.6; color: #6a4e32; }
      .controls b { color: #3b2a1a; }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="menu" hidden>
        <div class="card">
          <h1>Fat Bear or Weak</h1>
          <p class="tag">Fight for the best fishing spot. Be the heaviest bear by nightfall.</p>
          <input id="name" type="text" maxlength="14" placeholder="Your bear's name" autocomplete="off" />
          <button id="play">Play</button>
          <div class="toggles">
            <label><input id="sound" type="checkbox" checked /> Sound</label>
            <label><input id="music" type="checkbox" checked /> Music</label>
          </div>
          <div class="controls">
            <b>WASD</b> move · <b>mouse</b> aim · <b>left click</b> swipe · <b>E</b> charge<br />
            <b>hold right click</b> block · <b>Space/Shift</b> dash · <b>M</b> mute
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
